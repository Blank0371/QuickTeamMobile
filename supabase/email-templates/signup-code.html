<!-- Supabase → Authentication → Email Templates → Confirm signup -->
<!-- Requires {{ .Token }} in the template. Subject suggestion: "Your QuickTeam verification code" -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0;padding:0;background-color:#f4f5f7;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background-color:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e6e8eb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

        <!-- Brand bar -->
        <tr>
          <td style="background-color:#111827;padding:24px 32px;">
            <span style="color:#ffffff;font-size:20px;font-weight:700;letter-spacing:-0.02em;">QuickTeam</span>
          </td>
        </tr>

        <!-- Body -->
        <tr>
          <td style="padding:36px 32px 8px 32px;">
            <h1 style="margin:0 0 12px 0;font-size:22px;line-height:1.3;font-weight:700;color:#111827;">Confirm your email</h1>
            <p style="margin:0;font-size:15px;line-height:1.6;color:#4b5563;">
              Enter this 8-digit code in the app to finish setting up your account. It expires in 60 minutes.
            </p>
          </td>
        </tr>

        <!-- Code -->
        <tr>
          <td style="padding:28px 32px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td align="center" style="background-color:#f4f5f7;border:1px solid #e6e8eb;border-radius:12px;padding:22px 0;">
                  <span style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:34px;font-weight:700;letter-spacing:10px;color:#111827;">{{ .Token }}</span>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Footer note -->
        <tr>
          <td style="padding:0 32px 36px 32px;">
            <p style="margin:0;font-size:13px;line-height:1.6;color:#9ca3af;">
              Didn't try to sign up? You can safely ignore this email — no account will be created without this code.
            </p>
          </td>
        </tr>

      </table>

      <p style="margin:20px 0 0 0;font-size:12px;color:#9ca3af;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
        © QuickTeam
      </p>
    </td>
  </tr>
</table>
